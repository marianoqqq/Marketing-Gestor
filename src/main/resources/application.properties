spring.application.name=inmo-marketing-api
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/inmo_marketing_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:}
jwt.expiration=3600000
jwt.refresh.expiration=604800000

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=${GROQ_API_KEY:}
spring.ai.openai.chat.options.model=${GROQ_MODEL:openai/gpt-oss-120b}

openai.image.api-key=${OPENAI_API_KEY:}
openai.image.model=gpt-image-2.5-sunburst

cloudflare.r2.account-id=${R2_ACCOUNT_ID:}
cloudflare.r2.access-key=${R2_ACCESS_KEY_ID:}
cloudflare.r2.secret-key=${R2_SECRET_ACCESS_KEY:}
cloudflare.r2.bucket-name=${R2_BUCKET_NAME:}
cloudflare.r2.endpoint=${R2_ENDPOINT:}
cloudflare.r2.public-url=${R2_PUBLIC_URL:}

